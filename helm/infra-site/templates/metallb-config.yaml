SPDX-License-Identifier: Apache-2.0

MetalLB operand: controller/speaker (MetalLB CR), the dataplane VIP pool, and
an L2 advertisement. The operator and CRDs are installed by the prereqs chart;
the wait-operators job gates on the CRDs so these apply cleanly.

interfaces is optional:
  - Secondary/dedicated provisioning NIC: list it to pin the L2 advertisement
    to that interface (pair with nodeNetwork for its static IP).
  - FLAT network (VIPs on the primary/cluster network): leave it empty and
    MetalLB advertises the pool on all node interfaces.
*/}}

{{- if .Values.metallb.enabled }}
{{- if not .Values.metallb.addresses }}{{- fail "metallb.enabled=true requires metallb.addresses (set it in your infra-site-<site>.yaml override)" }}{{- end }}
apiVersion: metallb.io/v1beta1
kind: MetalLB
metadata:
  name: metallb
  namespace: {{ .Values.metallb.namespace }}
---
apiVersion: metallb.io/v1beta1
kind: IPAddressPool
metadata:
  name: {{ .Values.metallb.poolName }}
  namespace: {{ .Values.metallb.namespace }}
spec:
  addresses:
    {{- toYaml .Values.metallb.addresses | nindent 4 }}
  autoAssign: false
  avoidBuggyIPs: true
---
apiVersion: metallb.io/v1beta1
kind: L2Advertisement
metadata:
  name: {{ .Values.metallb.poolName }}
  namespace: {{ .Values.metallb.namespace }}
spec:
  ipAddressPools:
    - {{ .Values.metallb.poolName }}
  {{- with .Values.metallb.interfaces }}
  interfaces:
    {{- toYaml . | nindent 4 }}
  {{- end }}
{{- end }}
