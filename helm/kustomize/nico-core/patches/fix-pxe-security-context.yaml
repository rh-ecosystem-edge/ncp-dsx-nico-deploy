#
# Let OpenShift assign the namespace UID/GID, remove SYS_PTRACE, and opt into
# the host user namespaces required by the restricted-v3 SCC.
apiVersion: apps/v1
kind: Deployment
metadata:
  name: nico-pxe
spec:
  template:
    spec:
      hostUsers: false
      securityContext:
        fsGroup: null
      containers:
        - name: nico-pxe
          securityContext:
            runAsUser: null
            runAsGroup: null
            capabilities:
              add: []
