apiVersion: route.openshift.io/v1
kind: Route
metadata:
  name: nico-rest-api
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "nvidia-infra-controller-cloud-infra.labels" . | nindent 4 }}
spec:
  to:
    kind: Service
    name: nico-rest-api
  port:
    targetPort: http
  tls:
    termination: edge
    insecureEdgeTerminationPolicy: Redirect
