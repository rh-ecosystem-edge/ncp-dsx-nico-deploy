#
# mkosi profile: scout-rhel10-loader-x86_64
#
# Builds the NICo Scout UKI (Unified Kernel Image) using RHEL 10 as the base
# distribution. This is a downstream-only profile; the upstream vendor submodule
# is never modified. The RHSM subscription certs are injected via SandboxTrees
# so mkosi can reach RHEL subscription repositories at build time.
#
# Kernel pinned at 6.12.0-211.64.1.el10_2 — must match scout-rhel10-oss-x86_64.

[Output]
Output=loader
CompressOutput=zstd
CompressLevel=19

[Distribution]
Distribution=rhel
Release=10

[Build]
Environment=MKOSI_CHROOT_SUPPRESS_CHOWN=1
         MKOSI_DNF=mkosi-dnf5
# RHSM subscription certs — populated at Docker build time from rhsm-certs-extractor stage.
# Path is relative to this profile's mkosi.conf directory, so ../rhsm-certs
# resolves to /workspace/pxe/mkosi.profiles/rhsm-certs in the Docker build context.
SandboxTrees=../rhsm-certs:/ ../gpg-keys:/
PackageManagerTrees=../pkgmngr-config:/

[Content]
WithDocs=no
Bootable=yes
RootPassword=password
Packages=
         cpio
         curl
         dbus
         NetworkManager
         iproute
         kmod
         kernel-core-6.12.0-211.64.1.el10_2
         kernel-modules-6.12.0-211.64.1.el10_2
         net-tools
         procps-ng
         systemd
         systemd-boot
         systemd-boot-unsigned
         systemd-resolved
         tpm2-tools
         tpm2-tss
         udev
         util-linux
         zstd
