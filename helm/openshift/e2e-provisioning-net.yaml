#
# Provisioning L2 for the NICo + KubeVirt e2e (see e2e-nico-kubevirt-sno.md).
#
# PRODUCTION-FAITHFUL MODEL (Phase C rebuild). The provisioning segment is a real
# EXTERNAL L2 fronted by the FRR ToR (nico-tor libvirt VM), exactly like a NICo
# site where the ToR switch owns the segment gateway and relays DHCP. This
# replaces the earlier node-as-fabric shortcut (node owned 192.168.253.1 on an
# isolated, uplink-less bridge + in-cluster boot-proxy/dhcp-relay), which existed
# only because MetalLB VIPs were thought unusable under OVN (Finding B). The
# return-path spike disproved that: OVN DOES DNAT LoadBalancer traffic arriving on
# br-ex from a foreign-subnet routed client, provided the node's default gateway
# is the ToR so OVN returns symmetrically (see CLAUDE.md "Networking / MetalLB"
# and the findingb spike result). So the e2e now uses real MetalLB VIPs + the ToR,
# and the boot-proxy/dhcp-relay are gone.
#
# Topology:
#   * The SNO libvirt domain has a SECOND NIC (enp7s0, MAC 52:54:00:e2:e0:11)
#     cabled to the `nico-prov` libvirt network (virbr-prov), where the ToR's
#     net1 owns the gateway 192.168.253.1/24 (the hostinband segment gateway from
#     the site config).
#   * `nicoprov0` is a NODE Linux bridge whose ONLY port is that uplink NIC and
#     which carries NO IP — it is pure L2 transit. The nested worker VM attaches
#     to it via the cnv-bridge NAD below, so worker <-> nicoprov0 <-> enp7s0 <->
#     virbr-prov <-> ToR: the worker is L2-adjacent to the ToR gateway, i.e. a
#     routed client behind the fabric, exactly like a bare-metal host.
#   * The ToR runs the DHCP relay (giaddr .253.1 -> nico-dhcp MetalLB VIP) and
#     the worker's UEFI HTTPClient boot URL points at the nico-pxe MetalLB VIP;
#     both VIPs are BGP-advertised to the ToR by MetalLB and reachable from the
#     worker via the ToR (L3), with replies returning through the node default
#     gateway = ToR. No node-local relay/proxy and no node IP on this segment.
#
# The node must NOT own 192.168.253.1 here: the ToR owns it on the same L2, so a
# node address would collide. `reserve_first = 10` in the site config keeps the
# allocator off .1-.10 (the ToR gateway).
#
# enp7s0 is the deterministic name of the SNO domain's second NIC (PCI slot is
# pinned by the persisted libvirt <interface>, so the name is stable across
# reboots). Applied by `make deploy-site E2E=1` after the nmstate operator.
---
apiVersion: nmstate.io/v1
kind: NodeNetworkConfigurationPolicy
metadata:
  name: nicoprov0
spec:
  desiredState:
    interfaces:
      - name: nicoprov0
        type: linux-bridge
        state: up
        ipv4:
          # No IP: the ToR owns the segment gateway (.253.1). This bridge is pure
          # L2 transit between the nested worker VM and the external ToR fabric.
          enabled: false
        ipv6:
          enabled: false
        bridge:
          options:
            stp:
              enabled: false
          port:
            # Uplink to the nico-prov libvirt network (-> ToR gateway .253.1).
            # Interface name depends on PCI slot order: enp2s0 (3-NIC VM: enp1s0=machine,
            # enp2s0=prov, enp3s0=machine-net). Verify with `ip link show` after SNO install.
            - name: enp2s0
---
# Attachment for worker VMs: cnv-bridge onto nicoprov0 with NO ipam, so the VM
# gets its address purely from DHCP (ToR relay -> nico-dhcp VIP). This is the NIC
# the worker PXE-boots from.
apiVersion: k8s.cni.cncf.io/v1
kind: NetworkAttachmentDefinition
metadata:
  name: nico-prov-vm
  namespace: nico-system
spec:
  config: |
    {
      "cniVersion": "0.3.1",
      "type": "cnv-bridge",
      "bridge": "nicoprov0",
      "ipam": {}
    }
