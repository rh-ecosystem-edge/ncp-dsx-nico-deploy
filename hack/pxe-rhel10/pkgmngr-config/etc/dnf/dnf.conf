# dnf.conf injected via mkosi PackageManagerTrees= for RHEL 10 profiles.
#
# optional_metadata_types=filelists: required for dnf5 full dependency
# resolution (see https://bugzilla.redhat.com/show_bug.cgi?id=2180842).
[main]
