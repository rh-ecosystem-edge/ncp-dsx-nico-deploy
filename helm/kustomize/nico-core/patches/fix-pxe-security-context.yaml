#
# Let OpenShift assign the namespace UID/GID and remove SYS_PTRACE. Keep
# hostUsers unset so the pod uses restricted-v2; restricted-v3's user namespace
# causes setgroups failures with the current PXE image on this cluster.
apiVersion: apps/v1
kind: Deployment
metadata:
  name: nico-pxe
spec:
  template:
    spec:
      securityContext:
        fsGroup: null
      containers:
        - name: nico-pxe
          securityContext:
            runAsUser: null
            runAsGroup: null
            capabilities:
              add: []
