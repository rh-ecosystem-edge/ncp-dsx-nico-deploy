#
# Example infra-site override: the MetalLB dataplane VIP pool and the static IP
# for the dataplane NIC. Copy to infra-site-<site>.yaml and set real values.
# Usage: make deploy-site-infra SITE_INFRA_VALUES=helm/values/infra-site-<site>.yaml
metallb:
  enabled: true
  # For a DPF/HCP cluster, use namespace: openshift-operators and set
  # createInstance: false to reuse DPF's MetalLB instance.
  # Range (not a single /32): one LB IP per service — see nico-core-example.yaml.
  addresses:
    - 10.0.0.100-10.0.0.110
  interfaces:
    - <dataplane-nic>      # e.g. ens1f0 — the node NIC on the provisioning VLAN

nodeNetwork:
  enabled: true
  interface: <dataplane-nic>
  address: 10.0.0.2        # free IP on the VLAN for the node's dataplane NIC
  prefixLength: 24
