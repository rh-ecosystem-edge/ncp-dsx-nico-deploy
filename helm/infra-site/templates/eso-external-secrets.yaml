SPDX-License-Identifier: Apache-2.0

ESO resources to sync the root CA certificate from cert-manager namespace
into the site namespace as nico-roots (used by Core nico-api for Vault TLS trust).

The site profile is deployed on its own cluster (separate from cloud), so it
must define its own ClusterSecretStore + backing ServiceAccount/RBAC rather
than relying on the cloud chart's `cert-manager-ns-secretstore`. Names are
suffixed `-site` so this also coexists with the cloud chart when both profiles
share a single cluster (e.g. CRC), without fighting over the same resources.
*/}}
---
apiVersion: external-secrets.io/v1
kind: ClusterSecretStore
metadata:
  name: cert-manager-ns-secretstore-site
  labels:
    {{- include "nvidia-infra-controller-site-infra.labels" . | nindent 4 }}
spec:
  provider:
    kubernetes:
      remoteNamespace: cert-manager
      server:
        caProvider:
          type: ConfigMap
          name: kube-root-ca.crt
          namespace: cert-manager
          key: ca.crt
      auth:
        serviceAccount:
          name: eso-cert-manager-ns-site
          namespace: cert-manager
---
apiVersion: v1
kind: ServiceAccount
metadata:
  name: eso-cert-manager-ns-site
  namespace: cert-manager
---
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: eso-secret-reader-site
  namespace: cert-manager
rules:
  - apiGroups: [""]
    resources: ["secrets"]
    verbs: ["get", "list", "watch"]
    resourceNames: ["nico-root-ca-secret"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: eso-secret-reader-site
  namespace: cert-manager
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: Role
  name: eso-secret-reader-site
subjects:
  - kind: ServiceAccount
    name: eso-cert-manager-ns-site
    namespace: cert-manager
---
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: nico-roots-eso
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "nvidia-infra-controller-site-infra.labels" . | nindent 4 }}
spec:
  secretStoreRef:
    name: cert-manager-ns-secretstore-site
    kind: ClusterSecretStore
  target:
    name: nico-roots
    creationPolicy: Owner
    template:
      type: Opaque
      data:
        ca.crt: "{{ "{{ .ca_crt }}" }}"
  data:
    - secretKey: ca_crt
      remoteRef:
        key: nico-root-ca-secret
        property: ca.crt
