{{- if and .Values.metallb.enabled .Values.metallb.manageOperator }}
apiVersion: v1
kind: Namespace
metadata:
  name: {{ .Values.metallb.namespace }}
  labels:
    {{- include "nvidia-infra-controller-prereqs.labels" . | nindent 4 }}
  annotations:
---
apiVersion: operators.coreos.com/v1
kind: OperatorGroup
metadata:
  # No targetNamespaces: the MetalLB operator only supports AllNamespaces
  # install mode (rejects OwnNamespace with UnsupportedOperatorGroup).
  name: metallb-operator
  namespace: {{ .Values.metallb.namespace }}
  labels:
    {{- include "nvidia-infra-controller-prereqs.labels" . | nindent 4 }}
  annotations:
---
apiVersion: operators.coreos.com/v1alpha1
kind: Subscription
metadata:
  name: metallb-operator
  namespace: {{ .Values.metallb.namespace }}
  labels:
    {{- include "nvidia-infra-controller-prereqs.labels" . | nindent 4 }}
  annotations:
spec:
  channel: {{ .Values.metallb.channel }}
  name: metallb-operator
  source: {{ .Values.metallb.source }}
  sourceNamespace: {{ .Values.metallb.sourceNamespace }}
  installPlanApproval: {{ .Values.metallb.installPlanApproval }}
{{- end }}
