apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization

resources:
  - all.yaml
  # Scout cloud-init snippet: sets ubuntu/ubuntu SSH credentials on the
  # discovery OS so operators can debug scout in-situ via iDRAC console or
  # SSH. Only needed during bare-metal bring-up; remove once machines are
  # fully discovered and provisioned.
  - scout-cloud-init.yaml
  # Bare-metal emulation for testing (see machine-a-tron-testing-guide.md).
  # Disabled for this real (non-MAT) deploy — image isn't built and it wastes
  # a scheduling slot on the single node. Re-enable for machine-a-tron testing.
  # - machine-a-tron.yaml

patches:
  # Remove nico-flow Namespace resource (conflicts with Helm ownership)
  - path: patches/remove-flow-namespace.yaml
    target:
      kind: Namespace
      name: nico-system

  # Core migration: pg_isready init, backoffLimit, fix secret key
  - path: patches/fix-core-migration.yaml
    target:
      kind: Job
      name: nico-api-migrate
  - path: patches/fix-core-secret-keys.yaml
    target:
      kind: Job
      name: nico-api-migrate

  # Core API deployment: fix Crunchy secret key (user not username)
  - path: patches/fix-core-deployment-keys.yaml
    target:
      kind: Deployment
      name: nico-api

  # Make nico-roots volume optional (stub for dev)
  - path: patches/fix-core-optional-volumes.yaml
    target:
      kind: Deployment
      name: nico-api

  # Remove SYS_PTRACE, set RUST_BACKTRACE=1 (production-safe)
  - path: patches/fix-core-security-context.yaml
    target:
      kind: Deployment
      name: nico-api

  # BMC proxy: fix Crunchy secret key (user not username)
  - path: patches/fix-bmc-proxy-secret-keys.yaml
    target:
      kind: Deployment
      name: nico-bmc-proxy

  # Flow deployment: fix Crunchy secret key (user not username)
  - path: patches/fix-flow-secret-keys.yaml
    target:
      kind: Deployment
      name: flow

  # Remove SYS_PTRACE from DSX Exchange Consumer for OpenShift SCC
  - path: patches/fix-dsx-exchange-consumer-security-context.yaml
    target:
      kind: Deployment
      name: nico-dsx-exchange-consumer

  # Remove SYS_PTRACE/IPC_LOCK from remaining Core services for OpenShift SCC
  - path: patches/fix-dhcp-security-context.yaml
    target:
      kind: Deployment
      name: nico-dhcp
  - path: patches/fix-hardware-health-security-context.yaml
    target:
      kind: Deployment
      name: nico-hardware-health
  - path: patches/fix-pxe-security-context.yaml
    target:
      kind: Deployment
      name: nico-pxe
  - path: patches/fix-ssh-console-security-context.yaml
    target:
      kind: Deployment
      name: nico-ssh-console-rs
  - path: patches/fix-dns-security-context.yaml
    target:
      kind: StatefulSet
      name: nico-dns

  # Fix wrong CLI flag guessed by the chart's binary-detection script
  - path: patches/fix-dns-flag-name.yaml
    target:
      kind: StatefulSet
      name: nico-dns

  # Expose DNS on Service port 53 -> targetPort 5353. nameservers advertises
  # this Service IP via DHCP option 6 and clients query it on :53, but nico-dns
  # binds :5353 (can't bind privileged :53, see nico-core.yaml). The chart's
  # service template omits targetPort, so this is a JSON patch, not a value.
  - path: patches/fix-dns-service-port.yaml
    target:
      kind: Service
      name: nico-dns

# Remap unbound ports 53 → 5353 (same pattern as nico-dns, avoids anyuid SCC)
  - path: patches/fix-unbound-port.yaml
    target:
      kind: Deployment
      name: nico-unbound

  # Inject main unbound.cfg into ConfigMap (chart template only renders
  # hardcoded keys, ignores extra localConfig entries)
  - path: patches/fix-unbound-config.yaml
    target:
      kind: ConfigMap
      name: unbound-local-config

  # Mount scout cloud-init snippets in nico-pxe. Pairs with the
  # scout-cloud-init.yaml ConfigMap resource above. Remove both when
  # debug access to scout is no longer needed.
  - path: patches/fix-pxe-scout-cloud-init.yaml
    target:
      kind: Deployment
      name: nico-pxe