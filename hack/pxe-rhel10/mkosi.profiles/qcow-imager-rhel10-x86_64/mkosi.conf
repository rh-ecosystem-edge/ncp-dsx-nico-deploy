#
# mkosi profile: qcow-imager-rhel10-x86_64
#
# Builds the NICo qcow-imager UKI (Unified Kernel Image) using RHEL 10 as the
# base distribution. Replaces the upstream Ubuntu noble qcow-imager profile.
# disk_imaging.sh runs inside this UKI to download and write QCOW2 images to disk.
#
# Kernel pinned at 6.12.0-211.64.1.el10_2 to match scout-rhel10-* profiles.
# RHSM subscription certs are injected via SandboxTrees (same pattern as scout profiles).

[Output]
Output=qcow-imager
CompressOutput=zstd
CompressLevel=19

[Distribution]
Distribution=rhel
Release=10

[Build]
Environment=MKOSI_CHROOT_SUPPRESS_CHOWN=1
         MKOSI_DNF=mkosi-dnf5
# RHSM subscription certs — populated at Docker build time from rhsm-certs-extractor stage.
# Path is relative to this profile's mkosi.conf directory, so ../rhsm-certs
# resolves to /workspace/pxe/mkosi.profiles/rhsm-certs in the Docker build context.
SandboxTrees=../rhsm-certs:/ ../gpg-keys:/
PackageManagerTrees=../pkgmngr-config:/

[Content]
CleanPackageMetadata=yes
WithDocs=no
Bootable=yes
RootPassword=password
Packages=
     chrony
     cloud-utils-growpart
     curl
     dbus
     dmidecode
     e2fsprogs
     efibootmgr
     file
     iproute
     iputils
     kernel-core-6.12.0-211.64.1.el10_2
     kernel-modules-6.12.0-211.64.1.el10_2
     lshw
     lvm2
     mstflint
     net-tools
     NetworkManager
     nvme-cli
     openssh-server
     parted
     pciutils
     qemu-img
     smartmontools
     systemd-boot
     tpm2-tools
     util-linux
     vim-minimal
     wget
     xfsprogs
