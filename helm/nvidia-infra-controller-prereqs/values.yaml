certManager:
  enabled: true
  channel: stable-v1
  source: redhat-operators
  sourceNamespace: openshift-marketplace
  installPlanApproval: Automatic
  namespace: cert-manager-operator

crunchyPostgres:
  enabled: true
  channel: v5
  source: certified-operators
  sourceNamespace: openshift-marketplace
  installPlanApproval: Automatic
  namespace: openshift-operators

rhbk:
  enabled: true
  channel: stable-v26
  source: redhat-operators
  sourceNamespace: openshift-marketplace
  installPlanApproval: Automatic
  namespace: rhbk-operator

externalSecrets:
  enabled: true
  channel: stable-v1
  source: redhat-operators
  sourceNamespace: openshift-marketplace
  installPlanApproval: Automatic
  namespace: openshift-operators

# MetalLB — LoadBalancer VIPs for the site-facing Core services (nico-api,
# nico-dhcp, nico-dns, nico-pxe, nico-ssh-console). Required by the production
# network model: without MetalLB these Services stay <pending> and the site is
# unreachable (see CLAUDE.md "Networking / MetalLB"). This block installs only
# the OPERATOR (Namespace + OperatorGroup + Subscription) and the singleton
# MetalLB instance CR; the address pools, advertisements and BGP peers are site
# networking config and live in helm/infra-site (values.metallb).
metallb:
  enabled: true
  channel: stable
  source: redhat-operators
  sourceNamespace: openshift-marketplace
  installPlanApproval: Automatic
  namespace: metallb-system

clusterIssuers:
  enabled: true

# kubernetes-nmstate operator — declarative node network config (NNCP) to give
# the dataplane NIC a static IP so MetalLB can advertise on it. Off by default.
nmstate:
  enabled: false
  channel: stable
  source: redhat-operators
  sourceNamespace: openshift-marketplace
  installPlanApproval: Automatic
  namespace: openshift-nmstate
