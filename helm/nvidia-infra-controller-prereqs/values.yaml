certManager:
  enabled: true
  channel: stable-v1
  source: redhat-operators
  sourceNamespace: openshift-marketplace
  installPlanApproval: Automatic
  namespace: cert-manager-operator

crunchyPostgres:
  enabled: true
  channel: v5
  source: certified-operators
  sourceNamespace: openshift-marketplace
  installPlanApproval: Automatic
  namespace: openshift-operators

rhbk:
  enabled: true
  channel: stable-v26
  source: redhat-operators
  sourceNamespace: openshift-marketplace
  installPlanApproval: Automatic
  namespace: rhbk-operator

externalSecrets:
  enabled: true
  channel: stable-v1
  source: redhat-operators
  sourceNamespace: openshift-marketplace
  installPlanApproval: Automatic
  namespace: openshift-operators

clusterIssuers:
  enabled: true

# MetalLB operator — LoadBalancer VIPs for NICo site services on a dedicated
# provisioning VLAN. Off by default; enable per-site (see helm/values/prereqs-example.yaml).
metallb:
  enabled: false
  # Set false when DPF already installed the cluster-wide MetalLB operator.
  # The wait hook still gates on the MetalLB CRDs when enabled.
  manageOperator: true
  channel: stable
  source: redhat-operators
  sourceNamespace: openshift-marketplace
  installPlanApproval: Automatic
  namespace: metallb-system

# kubernetes-nmstate operator — declarative node network config (NNCP) to give
# the dataplane NIC a static IP so MetalLB can advertise on it. Off by default.
nmstate:
  enabled: false
  channel: stable
  source: redhat-operators
  sourceNamespace: openshift-marketplace
  installPlanApproval: Automatic
  namespace: openshift-nmstate
