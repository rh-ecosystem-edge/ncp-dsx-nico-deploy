#
# Base unbound config for the NICo `.forge` compatibility resolver (see
# helm/values/nico-core-site.yaml `unbound:` block). The upstream unbound
# subchart mounts its per-site fragments (the `.forge` localData A records,
# forwarders, access-control, verbosity) at /etc/unbound/local.conf.d from the
# `unbound-local-config` ConfigMap; this base file wires the listener and
# includes those fragments.
server:
    # Listen on all interfaces on an UNPRIVILEGED port so the container runs as a
    # plain arbitrary OpenShift UID under restricted-v2 — no CAP_NET_BIND_SERVICE,
    # no custom SCC. The unbound subchart's Services keep port 53 and target the
    # named container ports (dns-udp/dns-tcp); the nico-core kustomize patch
    # fix-unbound-port.yaml maps those names to 5353 to match this.
    interface: 0.0.0.0
    interface: ::0
    port: 5353
    do-ip4: yes
    do-ip6: yes
    do-udp: yes
    do-tcp: yes
    access-control: 127.0.0.0/8 allow
    access-control: 192.168.0.0/16 allow
    access-control: 10.0.0.0/8 allow
    access-control: 172.16.0.0/12 allow
    access-control: 0.0.0.0/0 refuse
    # Run as the (arbitrary, non-root) OpenShift UID: never setuid or chroot.
    username: ""
    chroot: ""
    directory: "/etc/unbound"
    # Write nothing: no pidfile, log to stderr, no syslog. Keeps the filesystem
    # requirement read-only for an unknown UID.
    pidfile: ""
    logfile: ""
    use-syslog: no
    verbosity: 1
    # No DNSSEC trust anchors are configured, so unbound does not validate and
    # needs no writable root.key / auto-trust-anchor. The chart forwards every
    # zone (nico.local -> nico-dns, . -> upstream) and serves `.forge` from
    # localData, so recursion and root hints are unnecessary.

# Per-site fragments mounted by the unbound subchart (localData `.forge` records,
# forwarders.conf, access_control.conf, verbosity.conf, extended_statistics.conf,
# nico_local_unknowndomain.conf). Included at top level so their `server:` and
# `forward-zone:` sections apply.
include: "/etc/unbound/local.conf.d/*.conf"
