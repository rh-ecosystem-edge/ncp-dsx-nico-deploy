name: Build and Push Images

on:
  pull_request:
    paths:
      - 'docker/ubi/**'
      - 'helm/vendor/infra-controller'
  push:
    tags: ['v*']
  workflow_dispatch:

env:
  REGISTRY: ghcr.io
  IMAGE_PREFIX: ghcr.io/${{ github.repository }}
  PUSH: ${{ github.event_name == 'push' || github.event_name == 'workflow_dispatch' }}

jobs:
  rest-images:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    strategy:
      fail-fast: false
      matrix:
        image:
          - nico-rest-api
          - nico-rest-workflow
          - nico-rest-site-manager
          - nico-rest-site-agent
          - nico-rest-db
          - nico-rest-cert-manager
          - nico-flow
          - nico-psm
          - nicocli
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          submodules: true

      - name: Log in to ghcr.io
        if: env.PUSH == 'true'
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Extract container image metadata
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.IMAGE_PREFIX }}/${{ matrix.image }}
          flavor: |
            latest=false
          tags: |
            type=ref,event=branch
            type=ref,event=tag
            type=sha,format=short
            type=raw,value=${{ github.sha }}
            type=raw,value=latest,enable=${{ github.ref == 'refs/heads/main' }}

      - name: Generate VERSION file
        run: |
          cd helm/vendor/infra-controller/rest-api
          git describe --tags HEAD 2>/dev/null | sed 's/^v//' > VERSION
          [ -s VERSION ] || echo "dev" > VERSION

      - name: Build and push
        uses: docker/build-push-action@v6
        with:
          context: helm/vendor/infra-controller/rest-api
          file: docker/ubi/Dockerfile.${{ matrix.image }}
          push: ${{ env.PUSH }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
  core-images:
    # RHSM secrets aren't exposed to pull_request runs triggered from forks;
    # skip the build for those to avoid confusing failures.
    if: github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    strategy:
      fail-fast: false
      matrix:
        image:
          - name: nico-core
            dockerfile: docker/ubi/Dockerfile.nico-core
            context: helm/vendor/infra-controller
          - name: nico-nsm
            dockerfile: docker/ubi/Dockerfile.nico-nsm
            context: helm/vendor/infra-controller/rest-api
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          submodules: true

      - name: Log in to ghcr.io
        if: env.PUSH == 'true'
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Generate VERSION file
        run: |
          cd helm/vendor/infra-controller/rest-api
          git describe --tags HEAD 2>/dev/null | sed 's/^v//' > VERSION || echo "dev" > VERSION

      - name: Prepare RHSM secrets
        run: |
          echo "${{ secrets.REDHAT_ORG_ID }}" > /tmp/rhsm_org
          echo "${{ secrets.REDHAT_ACTIVATION_KEY }}" > /tmp/rhsm_activationkey

      - name: Extract Docker metadata
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.IMAGE_PREFIX }}/${{ matrix.image.name }}
          flavor: |
            latest=false
          tags: |
            type=ref,event=branch
            type=ref,event=tag
            type=sha,format=short
            type=raw,value=${{ github.sha }}
            type=raw,value=latest,enable=${{ github.ref == 'refs/heads/main' }}

      - name: Build and push
        uses: docker/build-push-action@v6
        with:
          context: ${{ matrix.image.context }}
          file: ${{ matrix.image.dockerfile }}
          push: ${{ env.PUSH }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
          secret-files: |
            rhsm_org=/tmp/rhsm_org
            rhsm_activationkey=/tmp/rhsm_activationkey
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
