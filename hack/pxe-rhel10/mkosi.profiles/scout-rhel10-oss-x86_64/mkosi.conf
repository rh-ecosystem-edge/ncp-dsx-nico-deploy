# mkosi profile: scout-rhel10-oss-x86_64
#
# Builds the NICo Scout rootfs (cpio+zstd archive) using RHEL 10 as the base
# distribution. This is a downstream-only profile; the upstream vendor submodule
# is never modified. The RHSM subscription certs are injected via SandboxTrees
# so mkosi can reach RHEL subscription repositories at build time.
#
# Package list maps the Ubuntu scout-oss-x86_64 profile to RHEL 10 AppStream /
# BaseOS equivalents. forge-scout binary is injected via mkosi.extra (placed
# at /opt/forge/forge-scout by the Docker build before mkosi runs).
#
# Kernel pinned at 6.12.0-211.64.1.el10_2 — must match scout-rhel10-loader-x86_64.

[Output]
Output=scout
CompressOutput=zstd
CompressLevel=6
Format=cpio

[Distribution]
Distribution=rhel
Release=10

[Build]
Environment=MKOSI_CHROOT_SUPPRESS_CHOWN=1
         MKOSI_DNF=mkosi-dnf5
# RHSM subscription certs — populated at Docker build time from rhsm-certs-extractor stage.
# Path is relative to this profile's mkosi.conf directory, so ../rhsm-certs
# resolves to /workspace/pxe/mkosi.profiles/rhsm-certs in the Docker build context.
SandboxTrees=../rhsm-certs:/ ../gpg-keys:/
PackageManagerTrees=../pkgmngr-config:/

[Content]
WithDocs=no
Bootable=no
RootPassword=password
Packages=
         bind-utils
         ca-certificates
         curl
         dbus
         dmidecode
         efibootmgr
         freeipmi
         git
         gdb
         iperf3
         ipmitool
         iproute
         iputils
         kmod
         kernel-core-6.12.0-211.64.1.el10_2
         kernel-modules-6.12.0-211.64.1.el10_2
         kernel-modules-extra-6.12.0-211.64.1.el10_2
         lldpd
         lshw
         mstflint
         mtr
         ncat
         net-tools
         nvme-cli
         openssh-server
         pciutils
         procps-ng
         python3
         python3-pip
         rdma-core
         sg3_utils
         smartmontools
         sudo
         systemd
         chrony
         NetworkManager
         tcpdump
         tmux
         tpm2-tools
         tpm2-tss
         udev
         util-linux
         wget
         zstd
