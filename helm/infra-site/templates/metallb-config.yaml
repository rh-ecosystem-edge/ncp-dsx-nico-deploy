SPDX-License-Identifier: Apache-2.0

MetalLB site network config: address pools + advertisements (+ BGP peers).
The operator and the singleton MetalLB instance are installed by the prereqs
chart; these operands land in the metallb-system namespace and are validated by
the MetalLB controller webhook (up by the time this chart is deployed).

metallb.l2.interfaces is optional:
  - Secondary/dedicated provisioning NIC: list it to pin the L2 advertisement
    to that interface (pair with nodeNetwork for its static IP).
  - FLAT network (VIPs on the primary/cluster network): leave it empty and
    MetalLB advertises the pool on all node interfaces.
*/}}

{{- if .Values.metallb.enabled }}
{{- range .Values.metallb.addressPools }}
apiVersion: metallb.io/v1beta1
kind: IPAddressPool
metadata:
  name: {{ .name }}
  namespace: {{ $.Values.metallb.namespace }}
  labels:
    {{- include "nvidia-infra-controller-site-infra.labels" $ | nindent 4 }}
spec:
  addresses:
    {{- toYaml .addresses | nindent 4 }}
  autoAssign: {{ .autoAssign | default false }}
---
{{- end }}
{{- if eq .Values.metallb.mode "l2" }}
apiVersion: metallb.io/v1beta1
kind: L2Advertisement
metadata:
  name: nico-site-l2
  namespace: {{ .Values.metallb.namespace }}
  labels:
    {{- include "nvidia-infra-controller-site-infra.labels" . | nindent 4 }}
spec:
  ipAddressPools:
    {{- range .Values.metallb.addressPools }}
    - {{ .name }}
    {{- end }}
  {{- with .Values.metallb.l2.interfaces }}
  interfaces:
    {{- toYaml . | nindent 4 }}
  {{- end }}
{{- else if eq .Values.metallb.mode "bgp" }}
{{- range .Values.metallb.bgp.peers }}
apiVersion: metallb.io/v1beta2
kind: BGPPeer
metadata:
  name: {{ .name }}
  namespace: {{ $.Values.metallb.namespace }}
  labels:
    {{- include "nvidia-infra-controller-site-infra.labels" $ | nindent 4 }}
spec:
  myASN: {{ $.Values.metallb.bgp.localASN }}
  peerASN: {{ .peerASN }}
  peerAddress: {{ .peerAddress }}
  peerPort: {{ .peerPort | default 179 }}
---
{{- end }}
apiVersion: metallb.io/v1beta1
kind: BGPAdvertisement
metadata:
  name: nico-site-bgp
  namespace: {{ .Values.metallb.namespace }}
  labels:
    {{- include "nvidia-infra-controller-site-infra.labels" . | nindent 4 }}
spec:
  ipAddressPools:
    {{- range .Values.metallb.addressPools }}
    - {{ .name }}
    {{- end }}
  {{- with .Values.metallb.bgp.advertisement.aggregationLength }}
  aggregationLength: {{ . }}
  {{- end }}
  {{- with .Values.metallb.bgp.advertisement.communities }}
  communities:
    {{- toYaml . | nindent 4 }}
  {{- end }}
  {{- if .Values.metallb.bgp.advertisement.localPref }}
  localPref: {{ .Values.metallb.bgp.advertisement.localPref }}
  {{- end }}
{{- end }}
{{- end }}
