#
# Example infra-site override for a FLAT network: the MetalLB dataplane VIPs
# live on the primary/cluster network (same subnet as the nodes), so there is
# no dedicated provisioning NIC and no NodeNetworkConfigurationPolicy.
#
# Copy to infra-site-<site>.yaml and set real values.
# Usage: make deploy-site-infra SITE_INFRA_VALUES=helm/values/infra-site-<site>.yaml
metallb:
  enabled: true
  # Range (not a single /32): one LB IP per service — see nico-core-example.yaml,
  # where each service (nico-api, nico-pxe, unbound, nico-dhcp) requests its own
  # IP from this range via loadBalancerIP.
  addresses:
    - 10.0.0.12-10.0.0.19
  # FLAT: leave empty so MetalLB advertises on all node interfaces (the primary
  # network). Do NOT list a NIC here unless the VIPs are on a separate VLAN.
  interfaces: []

# No static dataplane NIC on a FLAT network — the VIPs are reachable on the
# primary network the nodes already have.
nodeNetwork:
  enabled: false
