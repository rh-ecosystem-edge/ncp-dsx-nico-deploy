#
# kubernetes-nmstate operator for the NICo + KubeVirt e2e (see
# e2e-nico-kubevirt-sno.md). Provides NodeNetworkConfigurationPolicy (NNCP), the
# standard OpenShift mechanism for declaratively configuring node NICs/bridges.
#
# The e2e needs a node-level Linux bridge (nicoprov0) that carries a node IP so
# the SNO node can L3-route the provisioning subnet — i.e. play the role the
# physical fabric plays on a real NICo site, where kea replies to the DHCP
# relay's giaddr and the fabric routes that reply back. See
# helm/openshift/e2e-provisioning-net.yaml for the NNCP + attachments.
#
# Applied by `make deploy-site E2E=1` (see Makefile), before the NNCP.
---
apiVersion: v1
kind: Namespace
metadata:
  name: openshift-nmstate
  labels:
    kubernetes.io/metadata.name: openshift-nmstate
    openshift.io/cluster-monitoring: "true"
---
apiVersion: operators.coreos.com/v1
kind: OperatorGroup
metadata:
  name: openshift-nmstate
  namespace: openshift-nmstate
spec:
  targetNamespaces:
    - openshift-nmstate
---
apiVersion: operators.coreos.com/v1alpha1
kind: Subscription
metadata:
  name: kubernetes-nmstate-operator
  namespace: openshift-nmstate
spec:
  channel: stable
  name: kubernetes-nmstate-operator
  source: redhat-operators
  sourceNamespace: openshift-marketplace
  installPlanApproval: Automatic
---
# The operator watches this singleton CR (must be named `nmstate`) and rolls out
# the nmstate-handler DaemonSet that reconciles NNCPs on each node.
apiVersion: nmstate.io/v1
kind: NMState
metadata:
  name: nmstate
